<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WNY Auto Rentals</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <section class="hero">
    <div class="brand">WNY Auto Rentals · Private management</div>
    <h1>Keep every rental on track.</h1>
    <p>See late payments, record money received, and keep your vehicle and renter records organized in one local workspace.</p>
    <div class="actions">
      <button data-view="dashboard">Open Late Payments</button>
      <button data-view="payment" class="secondary">Log Payment</button>
      <button data-view="vehicles" class="secondary">Manage Fleet</button>
    </div>
  </section>
  <nav class="nav" id="nav"></nav>
  <div id="app"></div>
  <div class="footer">Local workspace · No cloud sync · Back up your data regularly</div>
</main>
<script src="app.js"></script>
</body>
</html>
